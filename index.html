<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trazabilidad muelle → planta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#18211d;--muted:#5f6b66;--line:#dfe3df;--bg:#eceeec;--coral:#d85a30;--green:#0f6e56;--brand:#185fa5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;max-width:480px;margin:0 auto;padding:24px 18px;min-height:100vh}
  h1{font-family:"Space Grotesk",sans-serif;font-size:1.3rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin:0 0 22px}
  a.card{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:14px}
  a.card .ico{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  a.card h2{font-family:"Space Grotesk",sans-serif;font-size:1.1rem;margin:0;font-weight:700}
  a.card p{margin:0;font-size:.8rem;opacity:.9}
  .muelle{background:var(--coral)}
  .planta{background:var(--green)}
  .oficina{background:var(--brand)}
</style>
</head>
<body>
  <h1>Trazabilidad</h1>
  <p class="sub">Muelle → Planta · elige tu estación</p>

  <a class="card muelle" href="carga.html">
    <span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h11l4 4v4H5z"/><path d="M9 16V4h7"/><circle cx="8.5" cy="18.5" r="1.8"/><circle cx="17.5" cy="18.5" r="1.8"/></svg></span>
    <div><h2>Carga · Muelle</h2><p>Registrar salida</p></div>
  </a>

  <a class="card planta" href="descarga.html">
    <span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 20V9l5-3 5 3v11M9 20v-5h2v5"/></svg></span>
    <div><h2>Descarga · Planta</h2><p>Registrar ingreso</p></div>
  </a>

  <a class="card oficina" href="portal.html">
    <span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8M8 17h5"/></svg></span>
    <div><h2>Portal · Oficina</h2><p>Monitor en ruta y etiquetas QR</p></div>
  </a>
</body>
</html>
